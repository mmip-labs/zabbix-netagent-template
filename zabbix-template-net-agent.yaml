          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: input
        - uuid: 10b7f0fc19ba4114a544dfb3b4d7cb8c
          name: upsSmartInputMinLineVoltage
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.3.2.3.0
