            - uuid: da8a258febd7408e9872e3ee588e0838
              expression: 'last(/UPS Net AgentA by SNMP/output.upsBaseOutputStatus)=7'
              name: 'UPS state is rebooting'
              opdata: 'Value: {ITEM.LASTVALUE1}'
