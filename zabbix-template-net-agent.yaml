          triggers:
            - uuid: 295d0b260eee4d6d9718e01f74d07b27
              expression: 'avg(/UPS Net AgentA by SNMP/input.upsSmartInputLineVoltage,#3)>={$UPS.INPUT_VOLT.MAX.WARN}'
              name: 'High Input Voltage'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
