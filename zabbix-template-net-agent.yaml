          name: upsBaseOutputPhase
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.4.1.2.0
          key: output.upsBaseOutputPhase
          delay: 3m
          history: 2w
          trends: '0'
          description: 'The current output phase.'
          tags:
            - tag: component
              value: output
        - uuid: 35246cbc6a604636aeb978f27d1bf587
          name: upsBaseOutputStatus
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.4.1.1.0
          key: output.upsBaseOutputStatus
          delay: 3m
