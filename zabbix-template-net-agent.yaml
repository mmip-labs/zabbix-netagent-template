            - uuid: 855a6320ed2741909f0ba37686184fd6
              expression: 'avg(/UPS Net AgentA by SNMP/input.upsSmartInputLineVoltage,#3)<={$UPS.INPUT_VOLT.MIN.WARN}'
              name: 'Low Input Voltage'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
