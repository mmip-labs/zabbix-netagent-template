                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 783225ff26c24252a59c1d26c8d1d8d7
          name: upsSmartInputMaxLineVoltage
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.3.2.2.0
          key: input.upsSmartInputMaxLineVoltage
          delay: 3m
          history: 2w
          value_type: FLOAT
          trends: '0'
          units: V
