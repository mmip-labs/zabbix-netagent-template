zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 563ed06b8df049d0966d5d4ec2ca8d9b
      name: UserTemplates
  templates:
    - uuid: 8a25ffacf41f4cd5a9c4bc805f8362f8
      template: 'UPS Net AgentA by SNMP'
      name: 'UPS Net AgentA by SNMP'
      description: |
        Zabbix template for NetAgentA smart module for UPS.
        
        By Aleksey Kuznetsov, ljflats@gmail.com
        
        Version 2.0
      groups:
        - name: UserTemplates
      items:
        - uuid: de0178ae8ed74f0e8aa22a2fc25e7d5b
          name: upsBaseBatteryStatus
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.2.1.1.0
          key: battery.upsBaseBatteryStatus
          delay: 3m
          history: 2w
          trends: '0'
          description: 'The status of the UPS batteries.  A batteryLow(3) value indicates the UPS will be unable to sustain the current load, and its services will be lost if power is not restored.  The amount of run time in reserve at the time of low battery can be configured by the upsSmartConfigLowBatteryRunTime.'
          valuemap:
            name: BatteryStatus
          tags:
            - tag: component
              value: battery
        - uuid: e2a7e3da1a0f4191af22897048ffced1
          name: upsBaseBatteryTimeOnBattery
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.2.1.2.0
          key: battery.upsBaseBatteryTimeOnBattery
          delay: 3m
          history: 2w
          trends: '0'
          units: s
          description: 'The elapsed time in seconds since the UPS has switched to battery power.'
          tags:
            - tag: component
              value: battery
        - uuid: 52b4bf8a863745af8c5c12593dc29711
          name: upsSmartBatteryCapacity
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.2.2.1.0
          key: battery.upsSmartBatteryCapacity
          delay: 3m
          history: 2w
          trends: '0'
          units: '%'
          description: 'The remaining battery capacity expressed in percent of full capacity.'
          tags:
            - tag: component
              value: battery
          triggers:
            - uuid: a69cd25e895d44d2ad1f21d5a1b0aad5
              expression: 'avg(/UPS Net AgentA by SNMP/battery.upsSmartBatteryCapacity,#3)<={$BATTERY.CAPACITY.MIN.WARN}'
              name: 'Low Battery Capacity'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: b7c9de068da04c448a3d1bb2886d82da
          name: upsSmartBatteryCurrent
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.2.2.7.0
          key: battery.upsSmartBatteryCurrent
          delay: 3m
          history: 2w
          trends: '0'
          units: '%'
          description: 'The current battery current expressed in percent of maximum current.'
          tags:
            - tag: component
              value: battery
        - uuid: a2400fbd627e411fa09983df51b39d02
          name: upsSmartBatteryFullChargeVoltage
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.2.2.6.0
          key: battery.upsSmartBatteryFullChargeVoltage
          delay: 3m
          history: 2w
          value_type: FLOAT
          trends: '0'
          units: V
          description: 'The fully charged battery voltage of the battery system used in the UPS, expressed in tenths of a volt.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: battery
        - uuid: ab252658f883485d80f2173e431a205d
          name: upsSmartBatteryReplaceIndicator
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.2.2.5.0
          key: battery.upsSmartBatteryReplaceIndicator
          delay: 3m
          history: 2w
          trends: '0'
          description: 'Indicates whether the UPS batteries need replacing.'
          valuemap:
            name: SmartBatteryReplaceIndicator
          tags:
            - tag: component
              value: battery
          triggers:
            - uuid: db11fe9cc54e47949dfb0b47febf478b
              expression: 'last(/UPS Net AgentA by SNMP/battery.upsSmartBatteryReplaceIndicator)=2'
              name: 'Battery needs replacing'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: d3df9d6b68b04eababd1f9613b7f9ef4
          name: upsSmartBatteryRunTimeRemaining
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.2.2.4.0
          key: battery.upsSmartBatteryRunTimeRemaining
          delay: 3m
          history: 2w
          trends: '0'
          units: s
          description: 'The UPS battery run time remaining before battery exhaustion, in seconds.'
          tags:
            - tag: component
              value: battery
        - uuid: 41aa17fe86834aee9d92fa561ca6b8b1
          name: upsSmartBatteryTemperature
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.2.2.3.0
          key: battery.upsSmartBatteryTemperature
          delay: 3m
          history: 2w
          trends: '0'
          units: C
          description: 'The current internal UPS temperature expressed in tenths of a Celsius degree.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: battery
          triggers:
            - uuid: feac689f2f4b4b99a75c60dbca3cba56
              expression: 'avg(/UPS Net AgentA by SNMP/battery.upsSmartBatteryTemperature,#3)>={$BATTERY.TEMP.MAX.WARN}'
              name: 'High Battery Temperature'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: a85995b75dfe4214936c50c1ca4c56e7
          name: upsSmartBatteryVoltage
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.2.2.2.0
          key: battery.upsSmartBatteryVoltage
          delay: 3m
          history: 2w
          value_type: FLOAT
          trends: '0'
          units: V
          description: 'The current battery voltage expressed in 1/10 VDC.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: battery
          triggers:
            - uuid: 019c6161c5ce4e91afbcd1466cc4aa5e
              expression: 'avg(/UPS Net AgentA by SNMP/battery.upsSmartBatteryVoltage,#3)>={$UPS.BATTERY_CHARGE.WARN}'
              name: 'High Battery Charge'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: b10f0b96de7144729b24703d175b78c2
          name: 'ICMP ping'
          type: SIMPLE
          key: icmpping
          history: 7d
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: caf17a49ab874e119c65b7333eaede1e
              expression: 'max(/UPS Net AgentA by SNMP/icmpping,#3)=0'
              name: 'Unavailable by ICMP ping'
              priority: HIGH
              description: 'Last three attempts returned timeout.  Please check device connectivity.'
              tags:
                - tag: scope
                  value: availability
        - uuid: fac2b6c36b914a4a96dc092d45faabe8
          name: 'ICMP loss'
          type: SIMPLE
          key: icmppingloss
          history: 7d
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: 68ae41df5bd4495b81d0226150c8244c
              expression: 'min(/UPS Net AgentA by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/UPS Net AgentA by SNMP/icmppingloss,5m)<100'
              name: 'High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'Unavailable by ICMP ping'
                  expression: 'max(/UPS Net AgentA by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 68fc88b00e2549d2802bbe3fba535f1f
          name: 'ICMP response time'
          type: SIMPLE
          key: icmppingsec
          history: 7d
          value_type: FLOAT
          units: ms
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1000'
          tags:
            - tag: component
              value: health
            - tag: component
              value: network
          triggers:
            - uuid: bb88388020944235aa12c0c0a6f719f9
              expression: 'avg(/UPS Net AgentA by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'High ICMP ping loss'
                  expression: 'min(/UPS Net AgentA by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/UPS Net AgentA by SNMP/icmppingloss,5m)<100'
                - name: 'Unavailable by ICMP ping'
                  expression: 'max(/UPS Net AgentA by SNMP/icmpping,#3)=0'
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 9fb16587bf7a40de9e46448136fdc717
          name: upsBaseInputPhase
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.3.1.1.0
          key: input.upsBaseInputPhase
          delay: 3m
          history: 2w
          trends: '0'
          description: 'The current AC input phase.'
          tags:
            - tag: component
              value: battery
        - uuid: 9147870d88334fad809120b355b9412d
          name: upsSmartInputFrequency
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.3.2.4.0
          key: input.upsSmartInputFrequency
          delay: 3m
          history: 2w
          value_type: FLOAT
          trends: '0'
          units: Hz
          description: 'The current input frequency to the UPS system in 1/10 Hz.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: input
          triggers:
            - uuid: da133048bc054a46b7271fb7a3e8cbee
              expression: 'avg(/UPS Net AgentA by SNMP/input.upsSmartInputFrequency,#3)>={$UPS.INPUT_FREQ.MAX.WARN}'
              name: 'High Input Frequency'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
            - uuid: 2b29705f9db142dc82ea06e6ce1f4152
              expression: 'avg(/UPS Net AgentA by SNMP/input.upsSmartInputFrequency,#3)<={$UPS.INPUT_FREQ.MIN.WARN}'
              name: 'Low Input Frequency'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 037ebac63fc44d30bbf6d79ce400d0b0
          name: upsSmartInputLineFailCause
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.3.2.5.0
          key: input.upsSmartInputLineFailCause
          delay: 3m
          history: 2w
          trends: '0'
          description: 'The reason for the occurrence of the last transfer to UPS battery power.  The variable is set to noTransfer(1) if there is no transfer yet.   The variable is set to highLineVoltage(2) if the transfer to battery is caused by an over voltage greater than the high transfer voltage. The variable is set to brownout(3) if the duration of the outage is greater than five seconds and the line voltage is between 40 percent of the rated output voltage and the low transfer voltage. The variable is set to blackout(4) if the duration of the outage is greater than five seconds and the line voltage is between 40 percent of the rated output voltage and ground.  The variable is set to smallMomentarySag(5) if the duration of the outage is less than five seconds and the line voltage is between 40 percent of the rated output voltage and the low transfer voltage.  The variable is set to deepMomentarySag(6) if the duration of the outage is less than five seconds and the line voltage is between 40 percent of the rated output voltage and ground.'
          valuemap:
            name: LineFailCause
          tags:
            - tag: component
              value: input
          triggers:
            - uuid: f4ecc99b823c4281bb4e2a37f87ddd39
              expression: 'last(/UPS Net AgentA by SNMP/input.upsSmartInputLineFailCause)=4'
              name: 'UPS transfer to the battery power due to blackout'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
            - uuid: 23f281eb0ca84ce2adb701a1df071335
              expression: 'last(/UPS Net AgentA by SNMP/input.upsSmartInputLineFailCause)=3'
              name: 'UPS transfer to the battery power due to brownout'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
            - uuid: 93e2d993f8254238bf6fa5c5379d70ef
              expression: 'last(/UPS Net AgentA by SNMP/input.upsSmartInputLineFailCause)=6'
              name: 'UPS transfer to the battery power due to deep Momentary Sag'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
            - uuid: d2b96c5666de47d0ac62a4f40a3bf623
              expression: 'last(/UPS Net AgentA by SNMP/input.upsSmartInputLineFailCause)=2'
              name: 'UPS transfer to the battery power due to high Line Voltage'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
            - uuid: 66a6ed3e9e274ebfb61fac5847c8749c
              expression: 'last(/UPS Net AgentA by SNMP/input.upsSmartInputLineFailCause)=8'
              name: 'UPS transfer to the battery power due to large Momentary Spike'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
            - uuid: 652f678a563d48cbaccb0696804d63f8
              expression: 'last(/UPS Net AgentA by SNMP/input.upsSmartInputLineFailCause)=5'
              name: 'UPS transfer to the battery power due to small Momentary Sag'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
            - uuid: b674b9fcefe54aba8902bd3ab61d923a
              expression: 'last(/UPS Net AgentA by SNMP/input.upsSmartInputLineFailCause)=7'
              name: 'UPS transfer to the battery power due to small Momentary Spike'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: availability
                - tag: scope
                  value: performance
        - uuid: 734af0fde9d14159b5a7f3c0bb34fe59
          name: upsSmartInputLineVoltage
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.935.1.1.1.3.2.1.0
          key: input.upsSmartInputLineVoltage
          delay: 3m
          history: 2w
          value_type: FLOAT
          trends: '0'
