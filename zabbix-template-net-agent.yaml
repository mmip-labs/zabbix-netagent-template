                  value: availability
                - tag: scope
                  value: performance
            - uuid: 256dd4d386d849bcade1bfde69e759c4
              expression: 'last(/UPS Net AgentA by SNMP/output.upsBaseOutputStatus)=9'
              name: 'UPS state is on buck'
              opdata: 'Value: {ITEM.LASTVALUE1}'
